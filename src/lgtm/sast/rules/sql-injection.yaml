rules:
  - id: lgtm-python-sqli-fstring
    languages: [python]
    severity: ERROR
    message: >-
      Possible SQL injection: SQL query built with an f-string. Use
      parameterized queries (placeholders) instead of string interpolation.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $CUR.execute(f"...", ...)
          - pattern: $CUR.executemany(f"...", ...)
          - pattern: |
              $Q = f"..."
              ...
              $CUR.execute($Q, ...)
          - pattern: |
              $Q = f"..."
              ...
              $CUR.executemany($Q, ...)

  - id: lgtm-python-sqli-format
    languages: [python]
    severity: ERROR
    message: >-
      Possible SQL injection: SQL query built with str.format() or
      %-formatting. Use parameterized queries instead.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $CUR.execute("...".format(...), ...)
          - pattern: $CUR.execute("..." % ..., ...)
          - pattern: $CUR.execute("..." + $X, ...)
          # Concatenation that closes a quoted literal: "... = '" + x + "'"
          # parses as ("..." + x) + "'" and is missed by the pattern above.
          - pattern: $CUR.execute("..." + $X + "...", ...)
          - pattern: $CUR.executemany("...".format(...), ...)
          - pattern: $CUR.executemany("..." % ..., ...)
          - pattern: $CUR.executemany("..." + $X, ...)
          - pattern: $CUR.executemany("..." + $X + "...", ...)

  - id: lgtm-python-sqli-sqlalchemy-text
    languages: [python]
    severity: WARNING
    message: >-
      SQLAlchemy text()/exec_driver_sql() with dynamic content may allow SQL
      injection if user input is interpolated. Verify that only bound
      parameters are used.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      category: security
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: sqlalchemy.text(f"...")
          - pattern: text(f"...")
          - pattern: text("..." + $X)
          - pattern: text("..." + $X + "...")
          - pattern: text("...".format(...))
          - pattern: text("..." % ...)
          - pattern: $CONN.exec_driver_sql(f"...", ...)
          - pattern: $CONN.exec_driver_sql("..." + $X, ...)
          - pattern: $CONN.exec_driver_sql("..." + $X + "...", ...)
          - pattern: $CONN.exec_driver_sql("..." % ..., ...)
          - pattern: $CONN.exec_driver_sql("...".format(...), ...)

  - id: lgtm-python-sqli-execute-text-call
    languages: [python]
    severity: WARNING
    message: >-
      Raw SQL executed through SQLAlchemy. Confirm parameters are bound, not
      interpolated into the query string.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      category: security
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: $DB.execute(text($Q), ...)
          - pattern: $SESSION.execute(text($Q), ...)
