<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LGTM review results</title>
<style>
:root {
  --paper: #f4f6f5;
  --sheet: #ffffff;
  --ink: #1d2733;
  --ink-soft: #4d5a68;
  --rule: #d5dcdf;
  --teal: #0e6b6b;
  --teal-wash: #e3f0ef;
  --add: #e7f4ea;
  --add-ink: #1f6b35;
  --del: #fbeaea;
  --del-ink: #8f2a2a;
  --cite: #fff1c7;
  --real: #a4262c;
  --amber: #8a5a00;
  --slate: #5b6875;
  --good: #1f6b35;
  --sans: Seravek, "Gill Sans Nova", Ubuntu, Calibri, "DejaVu Sans", source-sans-pro, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151b21; --sheet: #1c242c; --ink: #e3e8ec; --ink-soft: #a6b2bd; --rule: #313d48;
    --teal: #5fc2bd; --teal-wash: #1d3433; --add: #17301f; --add-ink: #8fd6a2; --del: #3a1d1f;
    --del-ink: #f0a3a3; --cite: #4a3d12; --real: #f08a8e; --amber: #e2b45a; --slate: #9aa7b3;
    --good: #8fd6a2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151b21; --sheet: #1c242c; --ink: #e3e8ec; --ink-soft: #a6b2bd; --rule: #313d48;
  --teal: #5fc2bd; --teal-wash: #1d3433; --add: #17301f; --add-ink: #8fd6a2; --del: #3a1d1f;
  --del-ink: #f0a3a3; --cite: #4a3d12; --real: #f08a8e; --amber: #e2b45a; --slate: #9aa7b3;
  --good: #8fd6a2; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
a { color: var(--teal); }
a:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible, input:focus-visible {
  outline: 2px solid var(--teal); outline-offset: 2px;
}
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
nav.rail { border-right: 1px solid var(--rule); padding: 24px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
.brand span { display: block; font-size: 13px; font-weight: 400; color: var(--ink-soft); letter-spacing: 0; }
nav.rail ul { list-style: none; padding: 0; margin: 28px 0 0; }
nav.rail li a { display: block; padding: 6px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); }
nav.rail li a[aria-current="page"] { background: var(--teal-wash); color: var(--teal); font-weight: 600; }
nav.rail .foot { margin-top: 28px; font-size: 13px; color: var(--ink-soft); }
nav.rail .foot button { font: inherit; background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
main { padding: 32px clamp(16px, 4vw, 48px) 64px; max-width: 1440px; }
h1 { font-size: 30px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.4px; }
h2 { font-size: 21px; margin: 36px 0 8px; }
h3 { font-size: 17px; margin: 22px 0 8px; }
.lede { color: var(--ink-soft); max-width: 68ch; margin: 0 0 20px; }
.muted { color: var(--ink-soft); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); }
table { border-collapse: collapse; width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 13px; font-weight: 600; color: var(--ink-soft); background: var(--paper); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; }
.bar { display: inline-block; vertical-align: middle; height: 8px; border-radius: 4px; background: var(--teal); margin-left: 8px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.ok { color: var(--good); }
.chip.bad { color: var(--real); }
.chip.err, .chip.none { color: var(--slate); }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.s-real, .s-vulnerable { color: var(--real); }
.s-unsupported, .s-possible, .s-insufficient_evidence { color: var(--amber); }
.s-not_real, .s-not_judged, .s-safe, .s-unknown { color: var(--slate); }
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0 16px; font-size: 14px; }
.filters select, .filters label { font: inherit; }
.filters select { background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 8px; }
.case-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; }
.tabs { display: flex; gap: 4px; margin: 18px 0 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.tabs button { font: inherit; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; cursor: pointer; color: var(--ink-soft); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--teal); font-weight: 600; }
.case-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; margin-top: 18px; align-items: start; }
.facts { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; font-size: 14px; position: sticky; top: 16px; }
.facts dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.facts dt { color: var(--ink-soft); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.diff-file { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 18px; overflow: hidden; }
.diff-file > header { padding: 8px 12px; font: 600 13px var(--mono); border-bottom: 1px solid var(--rule); background: var(--paper); overflow-wrap: anywhere; }
.diff { font: 12.5px/1.55 var(--mono); overflow-x: auto; }
.diff .hunk { color: var(--ink-soft); background: var(--teal-wash); padding: 2px 12px; white-space: pre; }
.dl { display: grid; grid-template-columns: 44px 44px minmax(0, 1fr); white-space: pre; }
.dl .no { color: var(--ink-soft); text-align: right; padding-right: 8px; user-select: none; }
.dl .tx { padding-right: 12px; }
.dl.add { background: var(--add); }
.dl.add .tx::before { content: "+"; color: var(--add-ink); }
.dl.del { background: var(--del); }
.dl.del .tx::before { content: "-"; color: var(--del-ink); }
.dl.ctx .tx::before { content: " "; }
.dl.cited { box-shadow: inset 4px 0 0 var(--amber); }
.dl.cited .tx { background: var(--cite); }
.pin { margin: 6px 12px 12px 88px; font-family: var(--sans); white-space: normal; }
.finding { background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--slate); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.finding.f-real, .finding.f-vulnerable { border-left-color: var(--real); }
.finding.f-unsupported, .finding.f-possible { border-left-color: var(--amber); }
.finding .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-bottom: 6px; }
.finding p { margin: 6px 0; max-width: 80ch; }
.finding details { margin-top: 8px; }
.finding summary { cursor: pointer; color: var(--teal); }
.ev { border-top: 1px dashed var(--rule); padding: 8px 0 0; margin-top: 8px; }
.ev pre, .trace pre { font: 12px/1.5 var(--mono); background: var(--paper); padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.trace { list-style: none; counter-reset: step; padding: 0; margin: 0; }
.trace li { counter-increment: step; position: relative; padding: 0 0 14px 40px; border-left: 2px solid var(--rule); margin-left: 14px; }
.trace li::before { content: counter(step); position: absolute; left: -14px; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--teal); color: var(--teal); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.trace .call { font: 600 13px var(--mono); overflow-wrap: anywhere; }
.empty { background: var(--sheet); border: 1px dashed var(--rule); border-radius: 8px; padding: 18px; color: var(--ink-soft); }
.loose { margin: 0 0 18px; }
@media (max-width: 1080px) { .case-grid { grid-template-columns: 1fr; } .facts { position: static; } }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  nav.rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 16px; }
  nav.rail ul { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
  .pin { margin-left: 12px; }
  .dl { grid-template-columns: 36px 36px minmax(0, 1fr); }
}
@media print { nav.rail { display: none; } .shell { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Benchmarks">
    <p class="brand">LGTM<span>PR security review results</span></p>
    <ul id="nav"></ul>
    <div class="foot">
      <p id="built"></p>
      <button type="button" id="theme">Switch theme</button>
    </div>
  </nav>
  <main id="app" tabindex="-1"></main>
</div>
<script id="lgtm-data" type="application/json">/*__LGTM_DATA__*/null</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("lgtm-data").textContent);
  var app = document.getElementById("app");

  // Every piece of run data is untrusted text (diffs and model output from public repos),
  // so the page builds DOM nodes and sets textContent; it never assigns innerHTML.
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "text") el.textContent = v;
      else if (k === "class") el.className = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }

  var MODE_NAMES = { "lgtm": "LGTM", "llm-only": "Plain LLM", "sast-only": "Semgrep only", "lgtm-no-sast": "LGTM without Semgrep" };
  var STATUS_NAMES = {
    real: "Real", not_real: "Not real", unsupported: "Evidence doesn't hold", not_judged: "Not judged",
    vulnerable: "Vulnerable", possible: "Possible", safe: "Safe", insufficient_evidence: "Insufficient evidence", unknown: "Unknown"
  };
  function webUrl(u) { return typeof u === "string" && /^https:\/\//.test(u) ? u : null; }
  function modeName(m) { return MODE_NAMES[m] || m; }
  function pct(x) { return x === null || x === undefined ? "–" : (x * 100).toFixed(0) + "%"; }
  function dec(x) { return x === null || x === undefined ? "–" : Number(x).toFixed(2); }
  function secs(x) { return x === null || x === undefined ? "–" : (x < 90 ? x.toFixed(0) + " s" : (x / 60).toFixed(1) + " min"); }
  function bench(key) { return DATA.benchmarks.filter(function (b) { return b.key === key; })[0]; }

  function outcomeChip(c) {
    if (!c) return h("span", { class: "chip none", text: "not run" });
    var o = c.outcome || "–";
    var cls = o === "TP" || o === "TN" ? "ok" : (o === "FP" || o === "FN" ? "bad" : "err");
    var title = { TP: "Caught a real vulnerability", TN: "Correctly stayed quiet", FP: "False alarm on safe code", FN: "Missed the vulnerability", ERROR: "Run failed" }[o];
    return h("span", { class: "chip " + cls, title: title || null, text: o });
  }
  function statusEl(s, severity) {
    return h("span", { class: "status s-" + s, text: (STATUS_NAMES[s] || s) + (severity ? ", " + severity : "") });
  }

  function renderNav(route) {
    var nav = document.getElementById("nav");
    nav.textContent = "";
    var items = [["#/", "All results", route.view === "home"]];
    DATA.benchmarks.forEach(function (b) { items.push(["#/b/" + encodeURIComponent(b.key), b.title, route.key === b.key]); });
    items.forEach(function (it) {
      nav.appendChild(h("li", null, h("a", { href: it[0], "aria-current": it[2] ? "page" : null, text: it[1] })));
    });
    document.getElementById("built").textContent = "Built " + DATA.generated_at.replace("T", " ") + " from commit " + DATA.viewer_commit + ".";
  }

  function metricsTable(b) {
    var maxRows = b.modes.filter(function (m) { return b.summaries[m]; });
    if (!maxRows.length) return h("p", { class: "empty", text: "This benchmark has no summary.json yet. Its cases are listed below." });
    var head = h("tr", null, h("th", { text: "Mode" }), h("th", { class: "num", text: "Precision" }), h("th", { class: "num", text: "Recall" }),
      h("th", { text: "F1" }), h("th", { class: "num", text: "False alarms on safe PRs" }), h("th", { class: "num", text: "TP / FP / FN / TN" }),
      h("th", { class: "num", text: "Errors" }), h("th", { class: "num", text: "Median time per PR" }));
    var rows = maxRows.map(function (m) {
      var s = b.summaries[m], o = s.overall || {};
      var f1 = o.f1;
      return h("tr", null,
        h("td", null, h("strong", { text: modeName(m) }), s.model ? h("div", { class: "muted small", text: s.model }) : null),
        h("td", { class: "num", text: dec(o.precision) }), h("td", { class: "num", text: dec(o.recall) }),
        h("td", null, dec(f1), f1 === null || f1 === undefined ? null : h("span", { class: "bar", style: "width:" + Math.round(f1 * 120) + "px", "aria-hidden": "true" })),
        h("td", { class: "num", text: pct(o.false_positive_rate_on_safe) }),
        h("td", { class: "num", text: [o.tp, o.fp, o.fn, o.tn].map(function (x) { return x === undefined ? "–" : x; }).join(" / ") }),
        h("td", { class: "num", text: o.errors === undefined ? "–" : o.errors }),
        h("td", { class: "num", text: secs(s.median_latency_seconds) }));
    });
    return h("div", { class: "table-wrap" }, h("table", null, h("thead", null, head), h("tbody", null, rows)));
  }

  function disagree(c, modes) {
    var outs = modes.map(function (m) { return c.modes[m] ? c.modes[m].correct : null; }).filter(function (x) { return x !== null && x !== undefined; });
    return outs.indexOf(true) !== -1 && outs.indexOf(false) !== -1;
  }

  function renderHome() {
    var nodes = [h("h1", { text: "LGTM review results" }),
      h("p", { class: "lede", text: "How LGTM's multi-agent review compares with a plain LLM and Semgrep on the same pull requests. Open a benchmark to see every case, or a case to see the diff, what LGTM flagged, the evidence it cited and how the judge ruled." })];
    DATA.benchmarks.forEach(function (b) {
      var n = b.cases.filter(function (c) { return disagree(c, b.modes); }).length;
      nodes.push(h("h2", null, h("a", { href: "#/b/" + encodeURIComponent(b.key), text: b.title })));
      if (b.description) nodes.push(h("p", { class: "lede", text: b.description }));
      nodes.push(metricsTable(b));
      nodes.push(h("p", { class: "small muted" }, b.cases.length + " cases. ",
        n ? h("a", { href: "#/b/" + encodeURIComponent(b.key) + "?differ=1", text: n + " where the modes disagree" }) : "The modes agree on every case.",
        kevLine(b)));
    });
    return nodes;
  }
  function kevLine(b) {
    var s = b.summaries.lgtm;
    if (!s || !s.kev_verdicts) return null;
    var parts = Object.keys(s.kev_verdicts).map(function (k) { return s.kev_verdicts[k] + " " + (STATUS_NAMES[k] || k).toLowerCase(); });
    return " Judge verdicts in LGTM mode: " + parts.join(", ") + ".";
  }

  function renderBench(route) {
    var b = bench(route.key);
    if (!b) return [h("h1", { text: "Benchmark not found" }), h("p", null, h("a", { href: "#/", text: "Back to all results" }))];
    var cats = Array.from(new Set(b.cases.map(function (c) { return c.category; }).filter(Boolean)));
    var state = { cat: route.params.cat || "", differ: route.params.differ === "1" };
    var body = h("tbody");
    function draw() {
      body.textContent = "";
      b.cases.filter(function (c) {
        return (!state.cat || c.category === state.cat) && (!state.differ || disagree(c, b.modes));
      }).forEach(function (c) {
        var link = "#/b/" + encodeURIComponent(b.key) + "/" + encodeURIComponent(c.id);
        body.appendChild(h("tr", null,
          h("td", null, h("a", { href: link, text: c.id }), c.title ? h("div", { class: "muted small", text: c.title }) : null),
          h("td", { text: c.category || "–" }), h("td", { text: c.expected || "–" }),
          b.modes.map(function (m) { return h("td", null, outcomeChip(c.modes[m])); })));
      });
      if (!body.children.length) body.appendChild(h("tr", null, h("td", { colspan: 3 + b.modes.length, class: "muted", text: "No cases match these filters." })));
    }
    var catSel = h("select", { "aria-label": "Category", onchange: function (e) { state.cat = e.target.value; draw(); } },
      h("option", { value: "", text: "All categories" }), cats.map(function (c) { return h("option", { value: c, selected: c === state.cat, text: c }); }));
    var differ = h("input", { type: "checkbox", id: "differ", checked: state.differ, onchange: function (e) { state.differ = e.target.checked; draw(); } });
    draw();
    return [h("h1", { text: b.title }), b.description ? h("p", { class: "lede", text: b.description }) : null,
      metricsTable(b),
      h("h2", { text: "Cases" }),
      h("div", { class: "filters" }, catSel, h("label", { for: "differ" }, differ, " Only cases where the modes disagree")),
      h("div", { class: "table-wrap" }, h("table", null,
        h("thead", null, h("tr", null, h("th", { text: "Case" }), h("th", { text: "Category" }), h("th", { text: "Expected" }),
          b.modes.map(function (m) { return h("th", { text: modeName(m) }); }))), body))];
  }

  function citedLines(findings) {
    var cited = {};
    findings.forEach(function (f) {
      f.evidence.forEach(function (e) {
        if (e.type !== "code" || !e.file || !e.lines || e.grounded === false) return;
        var a = e.lines[0], z = e.lines[1] === undefined ? a : e.lines[1];
        for (var n = a; n <= z && n - a < 400; n++) cited[e.file + ":" + n] = true;
      });
    });
    return cited;
  }

  function findingCard(f) {
    var ev = f.evidence.map(function (e) {
      var where = e.type === "policy" ? "Policy: " + (e.source || "project docs") : (e.file || "code") + (e.lines ? " lines " + e.lines.join("–") : "");
      var mark = e.type === "code" ? (e.grounded === true ? "Found in the PR" : e.grounded === false ? "Not in the PR's code" : "") : "";
      return h("div", { class: "ev" }, h("div", { class: "small" }, h("strong", { text: where }), mark ? h("span", { class: "muted", text: "  " + mark }) : null),
        e.content ? h("pre", { text: e.content }) : null);
    });
    return h("article", { class: "finding f-" + f.status },
      h("div", { class: "meta" }, statusEl(f.status, f.severity), f.cwe ? h("span", { text: f.cwe }) : null,
        h("span", { class: "muted small", text: [f.agent, f.file && f.line ? f.file + ":" + f.line : f.file].filter(Boolean).join(", ") }),
        f.confidence !== null && f.confidence !== undefined ? h("span", { class: "muted small", text: "judge confidence " + pct(f.confidence) }) : null),
      f.explanation ? h("p", { text: f.explanation }) : null,
      f.reason ? h("p", { class: "muted small", text: "Why: " + f.reason }) : null,
      f.fix ? h("details", null, h("summary", { text: "Suggested fix" }), h("p", { text: f.fix })) : null,
      ev.length ? h("details", null, h("summary", { text: "Evidence (" + ev.length + ")" }), ev) : null);
  }

  function diffView(c, findings) {
    if (!c.diff.length) return [h("p", { class: "empty loose", text: "No diff is stored for this case. Rebuild the viewer with the case's clone cache available to show it." }),
      findings.length ? h("div", { class: "loose" }, h("h3", { text: "Findings" }), findings.map(findingCard)) : null];
    var cited = citedLines(findings);
    var placed = {};
    var files = c.diff.map(function (file) {
      var body = h("div", { class: "diff" });
      file.hunks.forEach(function (hk) {
        body.appendChild(h("div", { class: "hunk", text: hk.header }));
        hk.lines.forEach(function (ln) {
          var key = file.path + ":" + ln.n;
          var kind = ln.k === "+" ? "add" : ln.k === "-" ? "del" : "ctx";
          body.appendChild(h("div", { class: "dl " + kind + (ln.n && cited[key] ? " cited" : "") },
            h("span", { class: "no", text: ln.o || "" }), h("span", { class: "no", text: ln.n || "" }), h("span", { class: "tx", text: ln.t })));
          if (!ln.n) return;
          findings.forEach(function (f, i) {
            if (!placed[i] && f.file === file.path && f.line === ln.n) { placed[i] = true; body.appendChild(h("div", { class: "pin" }, findingCard(f))); }
          });
        });
      });
      return h("section", { class: "diff-file" }, h("header", { text: file.path }), body);
    });
    var loose = findings.filter(function (f, i) { return !placed[i]; });
    return [loose.length ? h("div", { class: "loose" }, h("h3", { text: loose.length === 1 ? "Finding not on a changed line" : "Findings not on a changed line" }), loose.map(findingCard)) : null,
      files, c.diff_truncated ? h("p", { class: "muted small", text: "The diff is cut short here to keep the page fast." }) : null];
  }

  function traceView(steps) {
    if (!steps.length) return h("p", { class: "muted", text: "This mode makes no tool calls, or the run stored no trace." });
    return h("ol", { class: "trace" }, steps.map(function (s) {
      return h("li", null, h("div", { class: "call", text: s.tool + "(" + s.args + ")" }),
        s.section ? h("div", { class: "muted small", text: "While reviewing: " + s.section }) : null,
        h("details", null, h("summary", { text: "Result" + (s.truncated ? " (shortened)" : "") }), h("pre", { text: s.result })));
    }));
  }

  function renderCase(route) {
    var b = bench(route.key);
    var c = b && b.cases.filter(function (x) { return x.id === route.caseId; })[0];
    if (!c) return [h("h1", { text: "Case not found" }), h("p", null, h("a", { href: "#/", text: "Back to all results" }))];
    var mode = c.modes[route.params.m] ? route.params.m : (c.modes.lgtm ? "lgtm" : Object.keys(c.modes)[0]);
    var r = c.modes[mode];
    var tabs = h("div", { class: "tabs", role: "tablist", "aria-label": "Review mode" }, b.modes.filter(function (m) { return c.modes[m]; }).map(function (m) {
      return h("button", { type: "button", role: "tab", "aria-selected": m === mode ? "true" : "false",
        onclick: function () { location.hash = "#/b/" + encodeURIComponent(b.key) + "/" + encodeURIComponent(c.id) + "?m=" + encodeURIComponent(m); } },
        modeName(m) + " ", outcomeChip(c.modes[m]));
    }));
    var cov = r.coverage || {};
    var facts = h("aside", { class: "facts", "aria-label": "Run facts" }, h("dl", null,
      h("dt", { text: "Outcome" }), h("dd", null, outcomeChip(r)),
      h("dt", { text: "Findings" }), h("dd", { text: String(r.findings.length) }),
      h("dt", { text: "Time" }), h("dd", { text: secs(r.latency) }),
      r.coverage ? [h("dt", { text: "Code reviewed" }), h("dd", { text: (cov.hunks_reviewed === null ? "–" : cov.hunks_reviewed) + " of " + (cov.hunks_total === null ? "–" : cov.hunks_total) + " changed hunks" + (cov.complete ? "" : " (incomplete)") })] : null,
      r.graph_state ? [h("dt", { text: "Code graph" }), h("dd", { text: r.graph_state })] : null,
      r.trace.length ? [h("dt", { text: "Tool calls" }), h("dd", { text: String(r.trace.length) })] : null,
      c.vulnerable_files.length ? [h("dt", { text: "Advisory names" }), h("dd", { class: "mono small", text: c.vulnerable_files.join(", ") })] : null,
      r.outcome === "TP" && r.on_target !== null && r.on_target !== undefined ? [h("dt", { text: "Flag in that file" }), h("dd", { text: r.on_target ? "Yes" : "No, elsewhere in the PR" })] : null,
      r.error ? [h("dt", { text: "Error" }), h("dd", { text: r.error })] : null,
      r.code_sha ? [h("dt", { text: "LGTM commit" }), h("dd", { text: r.code_sha.slice(0, 10) })] : null));
    return [
      h("p", { class: "small" }, h("a", { href: "#/b/" + encodeURIComponent(b.key), text: b.title })),
      h("div", { class: "case-head" }, h("h1", { text: c.id }), c.expected ? h("span", { class: "muted", text: "Expected: " + c.expected }) : null,
        webUrl(c.url) ? h("a", { href: webUrl(c.url), rel: "noopener noreferrer", target: "_blank", text: "Open the PR on GitHub" }) : null,
        webUrl(c.advisory_url) ? h("a", { href: webUrl(c.advisory_url), rel: "noopener noreferrer", target: "_blank", text: "Read advisory " + (c.ghsa || "") }) : null),
      c.title ? h("p", { class: "lede", text: c.title }) : null,
      tabs,
      h("div", { class: "case-grid" }, h("div", null, diffView(c, r.findings),
        h("h2", { text: "How " + modeName(mode) + " got there" }), traceView(r.trace)), facts)];
  }

  function parseRoute() {
    var raw = location.hash.replace(/^#/, "") || "/";
    var q = raw.indexOf("?"), path = q === -1 ? raw : raw.slice(0, q), params = {};
    if (q !== -1) raw.slice(q + 1).split("&").forEach(function (kv) { var p = kv.split("="); params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ""); });
    var seg = path.split("/").filter(Boolean).map(decodeURIComponent);
    if (seg[0] === "b" && seg[2]) return { view: "case", key: seg[1], caseId: seg.slice(2).join("/"), params: params };
    if (seg[0] === "b" && seg[1]) return { view: "bench", key: seg[1], params: params };
    return { view: "home", params: params };
  }

  function render() {
    var route = parseRoute();
    renderNav(route);
    app.textContent = "";
    add(app, route.view === "case" ? renderCase(route) : route.view === "bench" ? renderBench(route) : renderHome());
    app.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  document.getElementById("theme").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
