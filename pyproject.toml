[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lgtm"
version = "0.1.0"
description = "LGTM - Context-Aware PR Security Agent combining Semgrep SAST with LLM agents grounded in repository context"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SE201 LGTM Team" }]
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-ollama>=0.3.4,<0.4",
    "langchain-community>=0.3,<0.4",
    "chromadb>=0.5",
    "pydantic>=2.5",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
sast = [
    "semgrep>=1.80",
]

[project.scripts]
lgtm = "lgtm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "requires_codegraph: needs the real codegraph binary; excluded from the graph runtime gate",
]
