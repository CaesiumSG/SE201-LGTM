<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up LGTM</title>
<style>
  body{font:16px/1.5 system-ui,-apple-system,sans-serif;background:#fafafa;color:#111;margin:0;display:grid;place-items:center;min-height:100vh}
  main{max-width:520px;padding:40px;background:#fff;border:1px solid #e5e5e5;border-radius:12px}
  h1{font-size:22px;margin:0 0 8px} p{color:#555} label{display:block;font-weight:600;margin:20px 0 6px}
  input[type=text]{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d4d4d4;border-radius:8px;font:inherit}
  button{margin-top:20px;background:#111;color:#fff;border:0;border-radius:8px;padding:12px 18px;font:600 15px system-ui;cursor:pointer}
  ul{color:#444;padding-left:20px} code{background:#f2f2f2;padding:1px 5px;border-radius:4px}
</style></head>
<body><main id="m"><h1>Create the LGTM GitHub App</h1><p>Loading…</p></main>
<script>
(async () => {
  const m = document.getElementById('m');
  const r = await fetch('/api/github/manifest').then(r => r.json());
  if (r.exists) { location.href = '/#/onboarding'; return; }
  m.innerHTML = `<h1>Create the LGTM GitHub App</h1>
    <p>This sends GitHub a manifest for a new app owned by your account. On GitHub you review it and press <b>Create GitHub App</b>; GitHub then hands the app's keys straight back to this server, which stores them locally (never in the repo).</p>
    <ul><li>Permissions: contents <code>read</code>, metadata <code>read</code>, pull requests <code>write</code>, checks <code>write</code></li>
    <li>Events: pull requests and check runs (installations are always sent)</li>
    <li>Webhooks reach this laptop through a smee.io relay</li></ul>
    <form method="post" action="${r.post_url}">
      <label for="n">App name (must be unique on GitHub)</label>
      <input type="text" id="n" value="LGTM Security Review ${Math.random().toString(36).slice(2, 6)}" maxlength="34">
      <input type="hidden" name="manifest" id="mf">
      <button type="submit">Continue to GitHub</button>
    </form>`;
  const mf = JSON.parse(r.manifest);
  const sync = () => { mf.name = document.getElementById('n').value.trim() || 'LGTM Security Review'; document.getElementById('mf').value = JSON.stringify(mf); };
  sync(); document.getElementById('n').addEventListener('input', sync);
})();
</script></body></html>
