<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 6; }
    .stage { fill: #f3f6fa; stroke: #4a6fa5; stroke-width: 1.5; rx: 8; }
    .agent { fill: #fff7e6; stroke: #c98a1a; stroke-width: 1.5; rx: 6; }
    .tools { fill: #f0faf0; stroke: #3a8f4a; stroke-width: 1.5; rx: 6; stroke-dasharray: 5 3; }
    .title { font-weight: bold; font-size: 14px; }
    .small { font-size: 11px; fill: #444; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; }
    .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 5 3; }
  </style>

  <!-- Inputs -->
  <rect class="box" x="20" y="40" width="150" height="70"/>
  <text x="95" y="62" text-anchor="middle" class="title">Pull request</text>
  <text x="95" y="80" text-anchor="middle" class="mono">git diff base..pr</text>
  <text x="95" y="96" text-anchor="middle" class="small">PR content is untrusted</text>

  <rect class="box" x="20" y="140" width="150" height="70"/>
  <text x="95" y="162" text-anchor="middle" class="title">Repository</text>
  <text x="95" y="180" text-anchor="middle" class="small">base branch: source code,</text>
  <text x="95" y="196" text-anchor="middle" class="small">security policy, API spec, README</text>

  <!-- Stage 1 -->
  <rect class="stage" x="210" y="20" width="230" height="220"/>
  <text x="325" y="42" text-anchor="middle" class="title">1. Context building</text>
  <rect class="box" x="225" y="55" width="200" height="44"/>
  <text x="325" y="73" text-anchor="middle">Diff parser</text>
  <text x="325" y="90" text-anchor="middle" class="mono">diff/git_diff.py</text>
  <rect class="box" x="225" y="108" width="200" height="56"/>
  <text x="325" y="126" text-anchor="middle">SAST: Semgrep CE</text>
  <text x="325" y="142" text-anchor="middle" class="small">bundled CWE-89 rules, offline;</text>
  <text x="325" y="156" text-anchor="middle" class="small">scans files at the PR ref</text>
  <rect class="box" x="225" y="173" width="200" height="56"/>
  <text x="325" y="191" text-anchor="middle">RAG index: ChromaDB</text>
  <text x="325" y="207" text-anchor="middle" class="small">policy docs + source chunks,</text>
  <text x="325" y="221" text-anchor="middle" class="small">all-MiniLM-L6-v2 embeddings</text>

  <!-- Agents -->
  <rect class="stage" x="480" y="20" width="230" height="220"/>
  <text x="595" y="42" text-anchor="middle" class="title">2–3. Reviewer agents</text>
  <rect class="agent" x="495" y="55" width="200" height="60"/>
  <text x="595" y="74" text-anchor="middle">SAST triage agent</text>
  <text x="595" y="90" text-anchor="middle" class="small">Semgrep finding → true/false</text>
  <text x="595" y="104" text-anchor="middle" class="small">positive (CWE-89)</text>
  <rect class="agent" x="495" y="125" width="200" height="60"/>
  <text x="595" y="144" text-anchor="middle">Authorization agent</text>
  <text x="595" y="160" text-anchor="middle" class="small">changed endpoint vs retrieved</text>
  <text x="595" y="174" text-anchor="middle" class="small">policy (CWE-639 / 862 / 863)</text>
  <text x="595" y="205" text-anchor="middle" class="small">Structured JSON: verdict, CWE,</text>
  <text x="595" y="219" text-anchor="middle" class="small">evidence, suggested fix</text>

  <!-- Tools -->
  <rect class="tools" x="480" y="265" width="230" height="80"/>
  <text x="595" y="285" text-anchor="middle" class="title">Agent tools (read-only, base branch)</text>
  <text x="595" y="304" text-anchor="middle" class="mono">read_file  grep_repo</text>
  <text x="595" y="320" text-anchor="middle" class="mono">search_policy  search_code</text>
  <text x="595" y="337" text-anchor="middle" class="small">5-call budget per finding</text>

  <!-- LLM -->
  <rect class="box" x="750" y="265" width="190" height="80"/>
  <text x="845" y="287" text-anchor="middle" class="title">Local LLM via Ollama</text>
  <text x="845" y="306" text-anchor="middle" class="mono">qwen2.5-coder:7b</text>
  <text x="845" y="322" text-anchor="middle" class="small">temperature 0, structured JSON;</text>
  <text x="845" y="336" text-anchor="middle" class="small">no code leaves the machine</text>

  <!-- Validator -->
  <rect class="stage" x="750" y="20" width="190" height="100"/>
  <text x="845" y="42" text-anchor="middle" class="title">4. Evidence validator</text>
  <text x="845" y="64" text-anchor="middle" class="small">every cited file, line, snippet</text>
  <text x="845" y="78" text-anchor="middle" class="small">and policy quote must exist</text>
  <text x="845" y="92" text-anchor="middle" class="small">in the repo or the diff;</text>
  <text x="845" y="106" text-anchor="middle" class="small">ungrounded findings are flagged</text>

  <!-- Report -->
  <rect class="stage" x="750" y="140" width="190" height="100"/>
  <text x="845" y="162" text-anchor="middle" class="title">5. Report builder</text>
  <text x="845" y="184" text-anchor="middle" class="mono">report.json / report.md</text>
  <text x="845" y="202" text-anchor="middle" class="small">exit code 1 on a confirmed</text>
  <text x="845" y="216" text-anchor="middle" class="small">vulnerable finding (CI gate);</text>
  <text x="845" y="230" text-anchor="middle" class="small">a human decides, nothing auto-fixes</text>

  <!-- Arrows -->
  <path class="arrow" d="M170,75 L225,77"/>
  <path class="arrow" d="M170,160 L225,136"/>
  <path class="arrow" d="M170,185 L225,201"/>
  <path class="arrow" d="M425,77 L495,85"/>
  <path class="arrow" d="M425,136 L495,90"/>
  <path class="arrow" d="M425,201 L495,155"/>
  <path class="arrow" d="M425,77 C460,77 460,145 495,150"/>
  <path class="arrow" d="M695,130 L750,70"/>
  <path class="arrow" d="M845,120 L845,140"/>
  <path class="arrow dashed" d="M595,240 L595,265"/>
  <path class="arrow" d="M710,200 C740,200 740,300 750,300"/>
  <path class="arrow dashed" d="M170,200 C200,300 400,305 480,305"/>

  <!-- Baselines -->
  <rect class="box" x="20" y="380" width="420" height="150"/>
  <text x="230" y="402" text-anchor="middle" class="title">Evaluation modes (benchmark/evaluate.py)</text>
  <text x="35" y="426" class="mono">--mode sast-only</text>
  <text x="175" y="426" class="small">Baseline A: Semgrep only, no LLM</text>
  <text x="35" y="448" class="mono">--mode llm-only</text>
  <text x="175" y="448" class="small">Baseline B: one LLM call on the diff; no SAST, RAG or tools</text>
  <text x="35" y="470" class="mono">--mode lgtm</text>
  <text x="175" y="470" class="small">Full pipeline above</text>
  <text x="35" y="492" class="mono">--mode lgtm-no-sast</text>
  <text x="175" y="492" class="small">Ablation: agents + RAG + tools, regex SQL detector</text>
  <text x="35" y="518" class="small">Metrics: precision / recall / F1 per category, grounding rate, off-category alarms, latency</text>

  <!-- Legend -->
  <rect class="stage" x="750" y="380" width="18" height="14"/>
  <text x="775" y="392" class="small">pipeline stage</text>
  <rect class="agent" x="750" y="404" width="18" height="14"/>
  <text x="775" y="416" class="small">LLM agent</text>
  <rect class="tools" x="750" y="428" width="18" height="14"/>
  <text x="775" y="440" class="small">tool calls (optional)</text>
  <path class="arrow" d="M750,462 L768,462"/>
  <text x="775" y="466" class="small">data flow</text>
  <path class="arrow dashed" d="M750,486 L768,486"/>
  <text x="775" y="490" class="small">on-demand lookup</text>
</svg>
