<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 6; }
    .stage { fill: #f3f6fa; stroke: #4a6fa5; stroke-width: 1.5; rx: 8; }
    .agent { fill: #fff7e6; stroke: #c98a1a; stroke-width: 1.5; rx: 6; }
    .tools { fill: #f0faf0; stroke: #3a8f4a; stroke-width: 1.5; rx: 6; stroke-dasharray: 5 3; }
    .title { font-weight: bold; font-size: 14px; }
    .small { font-size: 11px; fill: #444; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; }
    .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 5 3; }
  </style>

  <!-- Inputs -->
  <rect class="box" x="20" y="40" width="160" height="66"/>
  <text x="100" y="61" text-anchor="middle" class="title">Pull request</text>
  <text x="100" y="79" text-anchor="middle" class="mono">git diff base..pr</text>
  <text x="100" y="95" text-anchor="middle" class="small">PR content is untrusted</text>

  <rect class="box" x="20" y="140" width="160" height="84"/>
  <text x="100" y="161" text-anchor="middle" class="title">Repository</text>
  <text x="100" y="179" text-anchor="middle" class="small">base branch: source code,</text>
  <text x="100" y="194" text-anchor="middle" class="small">security policy, API spec,</text>
  <text x="100" y="209" text-anchor="middle" class="small">README</text>

  <!-- Stage 1 -->
  <rect class="stage" x="215" y="20" width="225" height="220"/>
  <text x="327" y="42" text-anchor="middle" class="title">1. Context building</text>
  <rect class="box" x="230" y="55" width="195" height="44"/>
  <text x="327" y="73" text-anchor="middle">Diff parser</text>
  <text x="327" y="90" text-anchor="middle" class="mono">diff/git_diff.py</text>
  <rect class="box" x="230" y="108" width="195" height="56"/>
  <text x="327" y="126" text-anchor="middle">SAST: Semgrep CE</text>
  <text x="327" y="142" text-anchor="middle" class="small">bundled CWE-89 rules, offline;</text>
  <text x="327" y="156" text-anchor="middle" class="small">scans files at the PR ref</text>
  <rect class="box" x="230" y="173" width="195" height="56"/>
  <text x="327" y="191" text-anchor="middle">RAG index: ChromaDB</text>
  <text x="327" y="207" text-anchor="middle" class="small">policy docs + source chunks,</text>
  <text x="327" y="221" text-anchor="middle" class="small">all-MiniLM-L6-v2 embeddings</text>

  <!-- Agents -->
  <rect class="stage" x="480" y="20" width="230" height="220"/>
  <text x="595" y="42" text-anchor="middle" class="title">2–3. Reviewer agents</text>
  <rect class="agent" x="495" y="55" width="200" height="60"/>
  <text x="595" y="74" text-anchor="middle">SAST triage agent</text>
  <text x="595" y="90" text-anchor="middle" class="small">Semgrep finding → true/false</text>
  <text x="595" y="104" text-anchor="middle" class="small">positive (CWE-89)</text>
  <rect class="agent" x="495" y="125" width="200" height="60"/>
  <text x="595" y="144" text-anchor="middle">Authorization agent</text>
  <text x="595" y="160" text-anchor="middle" class="small">changed endpoint vs retrieved</text>
  <text x="595" y="174" text-anchor="middle" class="small">policy (CWE-639 / 862 / 863)</text>
  <text x="595" y="205" text-anchor="middle" class="small">Structured JSON: verdict, CWE,</text>
  <text x="595" y="219" text-anchor="middle" class="small">evidence, suggested fix</text>

  <!-- Tools -->
  <rect class="tools" x="480" y="265" width="230" height="84"/>
  <text x="595" y="285" text-anchor="middle" class="title">Agent tools</text>
  <text x="595" y="300" text-anchor="middle" class="small">read-only, base branch only</text>
  <text x="595" y="318" text-anchor="middle" class="mono">read_file   grep_repo</text>
  <text x="595" y="333" text-anchor="middle" class="mono">search_policy   search_code</text>
  <text x="595" y="345" text-anchor="middle" class="small">5-call budget per finding</text>

  <!-- LLM -->
  <rect class="box" x="750" y="265" width="190" height="84"/>
  <text x="845" y="287" text-anchor="middle" class="title">Local LLM via Ollama</text>
  <text x="845" y="306" text-anchor="middle" class="mono">qwen2.5-coder:7b</text>
  <text x="845" y="323" text-anchor="middle" class="small">temperature 0, structured JSON;</text>
  <text x="845" y="338" text-anchor="middle" class="small">no code leaves the machine</text>

  <!-- Validator -->
  <rect class="stage" x="750" y="20" width="190" height="100"/>
  <text x="845" y="42" text-anchor="middle" class="title">4. Evidence validator</text>
  <text x="845" y="63" text-anchor="middle" class="small">every cited file, line, snippet</text>
  <text x="845" y="77" text-anchor="middle" class="small">and policy quote must exist</text>
  <text x="845" y="91" text-anchor="middle" class="small">in the repo or the diff;</text>
  <text x="845" y="105" text-anchor="middle" class="small">ungrounded findings are flagged</text>

  <!-- Report -->
  <rect class="stage" x="750" y="140" width="190" height="100"/>
  <text x="845" y="162" text-anchor="middle" class="title">5. Report builder</text>
  <text x="845" y="183" text-anchor="middle" class="mono">report.json / report.md</text>
  <text x="845" y="201" text-anchor="middle" class="small">exit code 1 on a confirmed</text>
  <text x="845" y="215" text-anchor="middle" class="small">vulnerable finding (CI gate);</text>
  <text x="845" y="229" text-anchor="middle" class="small">a human decides, nothing auto-fixes</text>

  <!-- Arrows -->
  <path class="arrow" d="M180,73 L230,77"/>
  <path class="arrow" d="M180,170 L230,136"/>
  <path class="arrow" d="M180,190 L230,201"/>
  <path class="arrow" d="M425,77 L495,85"/>
  <path class="arrow" d="M425,136 L495,90"/>
  <path class="arrow" d="M425,201 L495,155"/>
  <path class="arrow" d="M425,77 C460,77 460,145 495,150"/>
  <path class="arrow" d="M695,130 L750,70"/>
  <path class="arrow" d="M845,120 L845,140"/>
  <path class="arrow dashed" d="M595,240 L595,265"/>
  <path class="arrow" d="M710,200 C740,200 740,300 750,300"/>
  <path class="arrow dashed" d="M180,215 C220,320 400,307 480,307"/>

  <!-- Evaluation modes -->
  <rect class="box" x="20" y="385" width="440" height="170"/>
  <text x="240" y="407" text-anchor="middle" class="title">Evaluation modes (benchmark/evaluate.py)</text>
  <text x="35" y="431" class="mono">--mode sast-only</text>
  <text x="170" y="431" class="small">Baseline A: Semgrep only, no LLM</text>
  <text x="35" y="453" class="mono">--mode llm-only</text>
  <text x="170" y="453" class="small">Baseline B: one LLM call on the diff;</text>
  <text x="170" y="467" class="small">no SAST, no RAG, no tools</text>
  <text x="35" y="489" class="mono">--mode lgtm</text>
  <text x="170" y="489" class="small">Full pipeline above</text>
  <text x="35" y="511" class="mono">--mode lgtm-no-sast</text>
  <text x="170" y="511" class="small">Ablation: agents + RAG + tools, regex SQL detector</text>
  <text x="35" y="536" class="small">Metrics: precision / recall / F1 per category, grounding rate,</text>
  <text x="35" y="550" class="small">off-category alarm rate, median latency</text>

  <!-- Legend -->
  <rect class="stage" x="750" y="385" width="18" height="14"/>
  <text x="775" y="397" class="small">pipeline stage</text>
  <rect class="agent" x="750" y="409" width="18" height="14"/>
  <text x="775" y="421" class="small">LLM agent</text>
  <rect class="tools" x="750" y="433" width="18" height="14"/>
  <text x="775" y="445" class="small">tool calls (optional)</text>
  <path class="arrow" d="M750,467 L768,467"/>
  <text x="775" y="471" class="small">data flow</text>
  <path class="arrow dashed" d="M750,491 L768,491"/>
  <text x="775" y="495" class="small">on-demand lookup</text>
</svg>
