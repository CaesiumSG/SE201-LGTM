<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LGTM Architecture Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen drafting table. Diagram canvas left, element sheet right; C4 level rail above. */
:root {
  --bg: #eef1f5;
  --paper: #fbfcfd;
  --grid: #dde3ea;
  --ink: #142231;
  --muted: #5a6878;
  --line: #c6cfda;
  --edge: #6d7b8b;
  --edge-hl: #0f5fb8;
  --sel: #d9822b;
  --c-person: #0c3c6b;
  --c-system: #1660b0;
  --c-container: #3a80c9;
  --c-component: #8cbcec;
  --c-component-ink: #0c2a48;
  --c-external: #8b96a3;
  --c-store: #3a80c9;
  --c-code: #ffffff;
  --c-code-edge: #9fb3c8;
  --on-fill: #ffffff;
  --chip: #e2e8ef;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131a; --paper: #121a23; --grid: #1c2733; --ink: #e2e9f1; --muted: #93a2b3;
    --line: #2a3747; --edge: #7d8c9d; --edge-hl: #6fb2ff; --sel: #f0a04b;
    --c-person: #1e5288; --c-system: #2467ad; --c-container: #2f6aa6; --c-component: #24476b;
    --c-component-ink: #e2eefa; --c-external: #4a5563; --c-store: #2f6aa6; --c-code: #17212c;
    --c-code-edge: #3b4d60; --on-fill: #ffffff; --chip: #1c2733;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131a; --paper: #121a23; --grid: #1c2733; --ink: #e2e9f1; --muted: #93a2b3;
  --line: #2a3747; --edge: #7d8c9d; --edge-hl: #6fb2ff; --sel: #f0a04b;
  --c-person: #1e5288; --c-system: #2467ad; --c-container: #2f6aa6; --c-component: #24476b;
  --c-component-ink: #e2eefa; --c-external: #4a5563; --c-store: #2f6aa6; --c-code: #17212c;
  --c-code-edge: #3b4d60; --on-fill: #ffffff; --chip: #1c2733;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 12px; padding-block: 14px; box-sizing: border-box; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; flex: 1 1 280px; min-width: 0; }
.crumbs button { font: inherit; color: var(--edge-hl); background: none; border: 0; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
.crumbs button:hover { text-decoration: underline; }
.crumbs .here { color: var(--ink); font-weight: 600; padding: 3px 4px; }
.crumbs .sep { color: var(--muted); }
.search { position: relative; flex: 0 1 300px; min-width: 0; }
.search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink); }
.search input:focus-visible { outline: 2px solid var(--edge-hl); outline-offset: 1px; }
.results { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; max-height: 320px; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .14); padding: 4px; }
.results button { display: flex; width: 100%; justify-content: space-between; gap: 10px; text-align: left; font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
.results button:hover, .results button.active { background: var(--chip); }
.results small { color: var(--muted); font-family: var(--mono); font-size: 11px; white-space: nowrap; }

.rail { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.levels { display: flex; gap: 4px; flex-wrap: wrap; }
.lvl { font-family: var(--mono); font-size: 11.5px; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: transparent; cursor: default; }
.lvl.reach { color: var(--ink); cursor: pointer; }
.lvl.reach:hover { border-color: var(--edge-hl); }
.lvl.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.viewnote { font-size: 13px; color: var(--muted); flex: 1 1 320px; min-width: 0; }
.viewnote b { color: var(--ink); font-weight: 600; }
.modes { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.modes span { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font-family: var(--mono); font-size: 12px; padding: 5px 9px; border: 0; background: var(--paper); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--edge-hl); color: #fff; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 14px; min-height: 0; }
.canvas {
  position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  background-color: var(--paper);
  background-image: radial-gradient(var(--grid) 1px, transparent 1.2px);
  background-size: 18px 18px;
}
svg#dia { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
svg#dia.panning, svg#dia.dragging, svg#dia.dragging .node { cursor: grabbing; }
.zoom button:disabled { color: var(--muted); opacity: .45; cursor: default; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--paper); }
.zoom button { width: 32px; height: 30px; border: 0; background: var(--paper); color: var(--ink); font: 600 15px var(--mono); cursor: pointer; }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--chip); }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; max-width: calc(100% - 80px); padding: 7px 10px; background: color-mix(in srgb, var(--paper) 88%, transparent); border: 1px solid var(--line); border-radius: 7px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.hint { position: absolute; left: 10px; top: 10px; font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--paper) 88%, transparent); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); }

/* Diagram */
.node { cursor: grab; outline: none; }
.node .shape { stroke-width: 1.2; transition: opacity .15s; }
.node .t-name { font: 600 14px var(--sans); }
.node .t-kind { font: 400 10.5px var(--mono); }
.node .t-desc { font: 400 12px var(--sans); }
.node .t-code-name { font: 600 13px var(--mono); }
.node .t-sig { font: 400 11px var(--mono); }
.node:hover .shape, .node:focus-visible .shape { stroke: var(--edge-hl); stroke-width: 2.5; }
.node.sel .shape { stroke: var(--sel); stroke-width: 3; }
.node.dim { opacity: .2; }
.node .drill { cursor: zoom-in; }
.node .drill rect { fill: rgb(255 255 255 / .18); stroke: currentColor; }
.node .drill:hover rect { fill: rgb(255 255 255 / .38); }
.edge path { fill: none; stroke: var(--edge); stroke-width: 1.3; }
.edge.code path { stroke: var(--c-code-edge); stroke-width: 1.2; }
.edge text { font: 400 11px var(--sans); fill: var(--muted); }
.edge text.tech { font: 400 10px var(--mono); }
.edge .lbg { fill: var(--paper); opacity: .92; }
.edge.hl path { stroke: var(--edge-hl); stroke-width: 2.2; }
.edge.hl text { fill: var(--ink); }
.edge.dim { opacity: .12; }
.edge.via path { stroke-dasharray: 4 3; }
marker path { fill: var(--edge); }
marker#arr-hl path { fill: var(--edge-hl); }
marker#arr-code path { fill: var(--c-code-edge); }
.boundary rect { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 7 5; }
.boundary text { font: 600 12.5px var(--sans); fill: var(--muted); }
.boundary text.tech { font: 400 10.5px var(--mono); }
.boundary.cls rect { stroke-dasharray: 2 3; fill: color-mix(in srgb, var(--c-component) 10%, transparent); }
.boundary.cls text { cursor: pointer; fill: var(--ink); font: 600 12px var(--mono); }
.boundary.file > rect { stroke-dasharray: 6 4; }
.boundary.file text { font: 600 12px var(--mono); }
@media (prefers-reduced-motion: reduce) { .node .shape { transition: none; } }

/* Element sheet */
.panel { min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 16px 18px 20px; box-sizing: border-box; }
.panel h2 { margin: 2px 0 4px; font-size: 18px; font-weight: 700; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.panel h3 { margin: 18px 0 6px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.panel p { margin: 6px 0; }
.panel ul { margin: 4px 0; padding-left: 18px; }
.panel li { margin: 3px 0; }
.kindchip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.kindchip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.src { display: flex; flex-direction: column; gap: 3px; }
.src a, .src span { font-family: var(--mono); font-size: 12px; color: var(--edge-hl); overflow-wrap: anywhere; text-decoration: none; }
.src a:hover { text-decoration: underline; }
.rels { list-style: none; padding: 0 !important; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.rels button { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; padding: 5px 6px; border-radius: 5px; cursor: pointer; }
.rels button:hover { background: var(--chip); }
.rels .dir { color: var(--muted); font-family: var(--mono); }
.rels small { display: block; color: var(--muted); font-size: 12px; }
.rels code, .panel code { font-family: var(--mono); font-size: 12px; background: var(--chip); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.open { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; font: 600 13px var(--sans); color: #fff; background: var(--edge-hl); border: 0; padding: 8px 13px; border-radius: 7px; cursor: pointer; }
.open:hover { filter: brightness(1.08); }
.open:focus-visible, .seg button:focus-visible, .lvl:focus-visible, .rels button:focus-visible, .zoom button:focus-visible, .crumbs button:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.sig { font-family: var(--mono); font-size: 12.5px; background: var(--chip); padding: 8px 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.modebox { margin-top: 10px; padding: 9px 11px; border-radius: 7px; background: var(--chip); font-size: 13px; }
.modebox b { font-family: var(--mono); font-weight: 600; }
.elist { display: flex; flex-direction: column; gap: 1px; }
.elist button { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; padding: 5px 6px; border-radius: 5px; cursor: pointer; }
.elist button:hover { background: var(--chip); }
.elist small { color: var(--muted); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.muted { color: var(--muted); }
.err { padding: 24px; color: var(--muted); }

@media (max-width: 880px) {
  html, body { height: auto; }
  .app { height: auto; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .canvas { height: 64vh; min-height: 380px; }
  .panel { overflow: visible; }
  .hint { display: none; }
}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">C4 model · SE201-LGTM @ <span id="sha"></span></span>
      <h1>LGTM Architecture Map</h1>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Diagram path"></nav>
    <div class="search">
      <input id="q" type="search" placeholder="Jump to an element, file or function…" autocomplete="off" aria-label="Search elements">
      <div class="results" id="results" hidden></div>
    </div>
  </header>

  <div class="rail">
    <div class="levels" id="levels" role="group" aria-label="C4 level"></div>
    <div class="viewnote" id="viewnote"></div>
    <div class="modes" id="modes" hidden>
      <span>Pipeline mode</span>
      <div class="seg" id="modeseg"></div>
    </div>
    <label class="toggle" id="privwrap" hidden><input type="checkbox" id="priv"> Show private helpers</label>
  </div>

  <main class="stage">
    <section class="canvas" aria-label="Diagram">
      <svg id="dia" role="img" aria-label="Architecture diagram"></svg>
      <div class="hint">Drag boxes to rearrange · drag the background to pan · double-click or <b>⊞</b> to open · Esc to go up</div>
      <div class="zoom">
        <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zfit" title="Fit to screen" aria-label="Fit to screen">⤢</button>
        <button id="zreset" title="Reset layout" aria-label="Reset layout">↺</button>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

/* ---------- Build a view model ---------- */
function isPrivate(q) { return q.split(".").pop().startsWith("_"); }

function codeModel(v) {

  files.forEach((f, fi) => {
    for (const s of CODE[f] || []) symsAll.push(Object.assign({ file: f, fi }, s));

  state.priv = showPriv;

  const byKey = new Map(symsAll.map(s => [key(s), s]));
  const methodsOf = new Map();
  for (const s of symsAll) if (s.kind === "method") {
    const c = s.file + ":" + s.parent;
    if (!methodsOf.has(c)) methodsOf.set(c, []);
    methodsOf.get(c).push(s);
  }
  const visible = s => {
    if (s.kind === "class") {

    }
    if (s.kind === "method" && !showPriv && isPrivate(s.parent)) return false;
    return showPriv || !isPrivate(s.name);
  };
  const vis = new Set(symsAll.filter(visible).map(key));

  files.forEach((f, fi) => {
    if (multi) clusters.push({ id: "__f" + fi, label: f.replace(/^src\/lgtm\//, ""), tech: "[file]", cls: "file", parent: null });
  });
  for (const [c, ms] of methodsOf) {
    const vm = ms.filter(m => vis.has(key(m)));
    if (!vm.length) continue;
    const [file, cname] = [c.slice(0, c.lastIndexOf(":")), c.slice(c.lastIndexOf(":") + 1)];
    const cls = (CODE[file] || []).find(s => s.name === cname);
    clusters.push({ id: "__c:" + c, label: "class " + cname, cls: "cls", parent: multi ? "__f" + files.indexOf(file) : null, sym: cls ? Object.assign({ file }, cls) : null });
  }

      parent: s.kind === "method" ? "__c:" + s.file + ":" + s.parent : (multi ? "__f" + s.fi : null) });

  const resolveTarget = (s, t) => {
    const tk = "s:" + s.file + ":" + t;
    return tk;
  };
  const seenEdge = new Set();
  for (const s of symsAll) {
    if (!vis.has(key(s)) || s.kind === "class") continue;
    const stack = (s.calls || []).map(t => ({ t: resolveTarget(s, t), via: false }));
    const seen = new Set();
    while (stack.length) {

}

function viewModel(id) {
  const v = VIEWS[id]; v.id = id;
  if (v.level === 4) return codeModel(v);
  const nodes = v.nodes.map(n => Object.assign({}, n));
  const edges = v.edges.map(([from, to, label, tech, modes]) => ({ from, to, label, tech, modes }));
  const clusters = [];
  if (v.boundary) {

/* d3 curveBasis */
function basis(pts) {
  if (pts.length < 3) return "M" + pts.map(p => p.x + "," + p.y).join("L");

  const bez = (x, y) => { d += `C${(2 * x0 + x1) / 3},${(2 * y0 + y1) / 3} ${(x0 + 2 * x1) / 3},${(y0 + 2 * y1) / 3} ${(x0 + 4 * x1 + x) / 6},${(y0 + 4 * y1 + y) / 6}`; };
  for (const p of pts) {
    const x = p.x, y = p.y;
    if (st === 0) { st = 1; d += `M${x},${y}`; }
    else if (st === 1) { st = 2; }
    else { if (st === 2) { st = 3; d += `L${(5 * x0 + x1) / 6},${(5 * y0 + y1) / 6}`; } bez(x, y); }
    x0 = x1; x1 = x; y0 = y1; y1 = y;
    if (st === 1) { x0 = x1 = x; y0 = y1 = y; }
  }
  if (st === 3) { bez(x1, y1); d += `L${x1},${y1}`; } else if (st === 2) d += `L${x1},${y1}`;

}

function render() {

  dagre.layout(g);
  $("#priv").checked = state.priv;

  svg.innerHTML = "";
  const defs = el("defs", {}, svg);
  for (const id of ["arr", "arr-hl", "arr-code"]) {
    const m = el("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z" }, m);

  const saved = loadLayout();

  for (const n of model.nodes) {

    const s = saved[n.id];

  clusters.sort((a, b) => depth(a) - depth(b)).forEach(c => {
    c.el = el("g", { class: "boundary " + c.cls }, layerB);
    c.rect = el("rect", { rx: 10 }, c.el);
    c.text = el("text", {}, c.el);
    c.text.textContent = c.label;
    if (c.tech) { const tt = el("tspan", { class: "tech", dx: 8 }, c.text); tt.textContent = c.tech; }
    if (c.sym) {
      c.text.setAttribute("tabindex", "0"); c.text.setAttribute("role", "button");
      const pick = ev => { ev.stopPropagation(); if (!panMoved) select("cls:" + c.sym.file + ":" + c.sym.name); };

      c.text.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(ev); } });
    }

  for (const e of model.edges) {
    if (!e.key) continue;

    n.el.addEventListener("click", () => { if (!panMoved) select(n.id); });

  for (const e of edgeEls) routeEdge(e);
  layoutClusters();
  $("#zreset").disabled = !Object.keys(saved).length;
  applyModes();
  fit();

}

function placeNode(n) {

  else n.el.removeAttribute("transform");
}
function borderPoint(n, tx, ty) {
  const dx = tx - n.x, dy = ty - n.y;
  if (!dx && !dy) return { x: n.x, y: n.y };
  const hw = n.w / 2 + 2, hh = n.h / 2 + 2;
  const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  return { x: n.x + dx * t, y: n.y + dy * t };
}
function routeEdge(e) {
  const a = built.byId.get(e.from), b = built.byId.get(e.to);
  let d, lx, ly;
  if (!e.free && !moved(a) && !moved(b)) { d = basis(e.ge.points); lx = e.ge.x; ly = e.ge.y; }
  else {
    const s = borderPoint(a, b.x, b.y), t = borderPoint(b, a.x, a.y);
    const vert = Math.abs(t.y - s.y) >= Math.abs(t.x - s.x);
    const c1 = vert ? { x: s.x, y: (s.y + t.y) / 2 } : { x: (s.x + t.x) / 2, y: s.y };
    const c2 = vert ? { x: t.x, y: (s.y + t.y) / 2 } : { x: (s.x + t.x) / 2, y: t.y };
    d = `M${s.x},${s.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${t.x},${t.y}`;
    lx = (s.x + 3 * c1.x + 3 * c2.x + t.x) / 8; ly = (s.y + 3 * c1.y + 3 * c2.y + t.y) / 8;
  }
  e.path.setAttribute("d", d);
  if (e.lbg) {
    const top = ly - e.ge.height / 2;
    e.lbg.setAttribute("x", lx - e.ge.width / 2); e.lbg.setAttribute("y", top);
    for (const [t, off] of e.texts) { t.setAttribute("x", lx); t.setAttribute("y", top + off); }
  }
}
function clusterBox(c) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const grow = (a, b, c2, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c2); y1 = Math.max(y1, d); };
  for (const n of built.model.nodes) if (n.parent === c.id) grow(n.x - n.w / 2, n.y - n.h / 2, n.x + n.w / 2, n.y + n.h / 2);
  for (const k of built.clusters) if (k.parent === c.id) { const b = clusterBox(k); if (b) grow(b.x, b.y, b.x + b.w, b.y + b.h); }
  if (x0 === Infinity) return null;
  const px = 20, top = 34, bottom = 20;
  return { x: x0 - px, y: y0 - top, w: x1 - x0 + 2 * px, h: y1 - y0 + top + bottom };
}
function layoutClusters() {
  for (const c of built.clusters) {
    const b = clusterBox(c); c.box = b;
    if (!b) { c.el.setAttribute("display", "none"); continue; }
    c.rect.setAttribute("x", b.x); c.rect.setAttribute("y", b.y); c.rect.setAttribute("width", b.w); c.rect.setAttribute("height", b.h);
    c.text.setAttribute("x", b.x + 12); c.text.setAttribute("y", b.y + 21);
  }
}
function bounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of built.model.nodes) { x0 = Math.min(x0, n.x - n.w / 2); y0 = Math.min(y0, n.y - n.h / 2); x1 = Math.max(x1, n.x + n.w / 2); y1 = Math.max(y1, n.y + n.h / 2); }
  for (const c of built.clusters) if (c.box) { x0 = Math.min(x0, c.box.x); y0 = Math.min(y0, c.box.y); x1 = Math.max(x1, c.box.x + c.box.w); y1 = Math.max(y1, c.box.y + c.box.h); }
  for (const e of built.edges) if (e.lbg) { const x = +e.lbg.getAttribute("x"), y = +e.lbg.getAttribute("y"); x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + e.ge.width); y1 = Math.max(y1, y + e.ge.height); }
  const m = 40;
  return { x: x0 - m, y: y0 - m, w: x1 - x0 + 2 * m, h: y1 - y0 + 2 * m };
}

function applyModes() {
  if (!built) return;
  const on = VIEWS[state.view].modes;
  const dimN = new Set();
  for (const n of built.model.nodes) {
    const dim = on && n.modes && !n.modes.includes(state.mode);
    n.el.classList.toggle("dim", !!dim);
    if (dim) dimN.add(n.id);
  }
  for (const e of built.edges) {
    const dim = on && (dimN.has(e.from) || dimN.has(e.to) || (e.modes && !e.modes.includes(state.mode)));
    e.el.classList.toggle("dim", !!dim);
  }
}
function hl(id) {
  if (!built) return;
  for (const e of built.edges) {
    const on = id && (e.from === id || e.to === id);
    e.el.classList.toggle("hl", !!on);
    const p = e.el.querySelector("path");
    p.setAttribute("marker-end", "url(#" + (on ? "arr-hl" : e.code ? "arr-code" : "arr") + ")");
    if (on) e.el.parentNode.appendChild(e.el);
  }
}
function markSel() {
  if (!built) return;
  for (const n of built.model.nodes) n.el.classList.toggle("sel", n.id === state.sel);
  hl(state.sel);
}

/* ---------- Pan / zoom ---------- */
function applyT() { const s = $("#scene"); if (s) s.setAttribute("transform", `translate(${T.x},${T.y}) scale(${T.k})`); }
function fit() {
  if (!built) return;
  const r = svg.getBoundingClientRect(), b = bounds();
  const k = Math.min(r.width / b.w, r.height / b.h, 1.15);
  T = { k, x: (r.width - b.w * k) / 2 - b.x * k, y: (r.height - b.h * k) / 2 - b.y * k };
  fitted = true; applyT();
}
function zoomAt(f, px, py) {
  const r = svg.getBoundingClientRect();
  if (px == null) { px = r.width / 2; py = r.height / 2; }
  const k = Math.max(0.12, Math.min(3, T.k * f));
  T.x = px - (px - T.x) * (k / T.k); T.y = py - (py - T.y) * (k / T.k); T.k = k;
  fitted = false; applyT();
}
let drag = null, panMoved = false;
svg.addEventListener("pointerdown", ev => {
  if (ev.button !== 0 || !built) return;
  const ng = ev.target.closest && ev.target.closest(".node");
  const n = ng ? built.byId.get(ng.getAttribute("data-id")) : null;
  drag = { x: ev.clientX, y: ev.clientY, tx: T.x, ty: T.y, id: ev.pointerId, node: n, nx: n && n.x, ny: n && n.y };
  panMoved = false;
});
svg.addEventListener("pointermove", ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (!panMoved && Math.hypot(dx, dy) > 4) {
    panMoved = true;
    svg.classList.add(drag.node ? "dragging" : "panning");
    try { svg.setPointerCapture(drag.id); } catch (_) {}
  }
  if (!panMoved) return;
  if (drag.node) {
    const n = drag.node;
    n.x = drag.nx + dx / T.k; n.y = drag.ny + dy / T.k;
    placeNode(n);
    for (const e of built.edges) if (e.from === n.id || e.to === n.id) routeEdge(e);
    layoutClusters();
  } else { T.x = drag.tx + dx; T.y = drag.ty + dy; fitted = false; applyT(); }
});
const endPan = () => {
  if (drag && drag.node && panMoved) { saveLayout(); fitted = false; }
  drag = null; svg.classList.remove("panning", "dragging");
  setTimeout(() => { panMoved = false; }, 0);
};
svg.addEventListener("pointerup", endPan);
svg.addEventListener("pointercancel", endPan);
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0018)), ev.clientX - r.left, ev.clientY - r.top);
}, { passive: false });
svg.addEventListener("click", ev => { if (ev.target === svg && !panMoved) select(null); });
$("#zin").onclick = () => zoomAt(1.25);
$("#zout").onclick = () => zoomAt(0.8);
$("#zfit").onclick = fit;
$("#zreset").onclick = () => { try { localStorage.removeItem(layoutKey()); } catch (_) {} render(); };
new ResizeObserver(() => { if (fitted) fit(); }).observe(svg);

/* ---------- Navigation ---------- */
function chain(id) { const c = []; while (id) { c.unshift(id); id = VIEWS[id].parent; } return c; }
function go(id, selId) {
  if (!VIEWS[id]) return;
  const from = state.view;
  state.view = id; state.sel = selId || null;
  // arriving one level down: preselect nothing; arriving one level up: select the element we came from
  if (!selId && VIEWS[from] && VIEWS[from].parent === id) {
    const back = Object.values(viewModel(id).nodes).find(n => n.drill === from);
    if (back) state.sel = back.id;
  }
  try { history.replaceState(null, "", "#" + id); } catch (_) {}
  chrome(); render(); panel();
}
function up() { const p = VIEWS[state.view].parent; if (p) go(p); }
function select(id) { state.sel = id; markSel(); panel(); }

function chrome() {
  const v = VIEWS[state.view];
  const c = chain(state.view);
  const cr = $("#crumbs"); cr.innerHTML = "";
  c.forEach((id, i) => {
    if (i) cr.append(h("span", { class: "sep", "aria-hidden": "true" }, "›"));
    if (i === c.length - 1) cr.append(h("span", { class: "here" }, VIEWS[id].title));
    else cr.append(h("button", { on: { click: () => go(id) } }, VIEWS[id].title));
  });
  const L = ["Context", "Containers", "Components", "Code"];
  const lv = $("#levels"); lv.innerHTML = "";
  L.forEach((name, i) => {
    const target = c.find(id => VIEWS[id].level === i + 1);
    const b = h("button", { class: "lvl" + (v.level === i + 1 ? " on" : target ? " reach" : ""), title: target ? "Go to " + VIEWS[target].title : "Open an element to reach this level" }, "L" + (i + 1) + " " + name);
    if (target && v.level !== i + 1) b.onclick = () => go(target); else b.disabled = !target;
    lv.append(b);
  });
  $("#viewnote").innerHTML = v.note;
  $("#modes").hidden = !v.modes;
  $("#privwrap").hidden = v.level !== 4;
  $("#priv").checked = state.priv;
  const segs = $("#modeseg"); segs.innerHTML = "";
  for (const m of ALL) segs.append(h("button", { "aria-pressed": String(m === state.mode), title: MODES[m], on: { click: () => { state.mode = m; chrome(); applyModes(); panel(); } } }, m));
  const lg = $("#legend"); lg.innerHTML = "";
  const kinds = v.level === 4 ? [] : [...new Set(v.nodes.map(n => n.kind))];
  const sw = (varName, label, extra) => h("span", {}, h("i", { style: `background:var(${varName});${extra || ""}` }), label);
  for (const k of kinds) lg.append(sw(KIND[k].fill, KIND[k].label, k === "ext" ? "outline:1px dashed var(--muted)" : ""));
  if (v.level === 4) {
    lg.append(h("span", {}, h("b", { style: "font-family:var(--mono)" }, "ƒ m C"), " function · method · class"));
    lg.append(h("span", {}, "- - -  call through a hidden helper"));
  } else lg.append(h("span", {}, "⊞ has a detail view"));
}
$("#priv").addEventListener("change", ev => { state.privBy[state.view] = ev.target.checked; state.sel = null; render(); panel(); });

/* ---------- Element sheet ---------- */
function srcLinks(paths, line, end) {
  return h("div", { class: "src" }, paths.map(p => h("a", { href: REPO + p + (line ? "#L" + line + (end && end > line ? "-L" + end : "") : ""), target: "_blank", rel: "noopener" }, p + (line ? ":" + line : ""))));
}
function kindChip(kind, tech) {
  return h("span", { class: "kindchip" }, h("i", { style: `background:var(${kind === "code" ? "--c-code-edge" : KIND[kind].fill})` }), "[" + KIND[kind].label + (tech ? ": " + tech : "") + "]");
}
function relList(id) {
  const ul = h("ul", { class: "rels" });
  const dimN = new Set(built.model.nodes.filter(n => n.el.classList.contains("dim")).map(n => n.id));
  for (const e of built.edges) {
    if (e.from !== id && e.to !== id) continue;
    const out = e.from === id, other = built.byId.get(out ? e.to : e.from);
    const label = e.label ? e.label + (e.tech ? " · " + e.tech : "") : (e.via ? "calls via a private helper" : "calls");
    ul.append(h("li", {}, h("button", { on: { click: () => select(other.id) }, style: dimN.has(other.id) ? "opacity:.5" : "" },
      h("span", { class: "dir" }, out ? "→" : "←"), h("span", {}, other.name, h("small", {}, label)))));
  }
  return ul.children.length ? ul : h("p", { class: "muted" }, "No relationships drawn in this view.");
}
function viewSummary(p) {
  const v = VIEWS[state.view];
  p.append(h("span", { class: "eyebrow" }, "Level " + v.level + " · " + ["System context", "Container", "Component", "Code"][v.level - 1] + " diagram"));
  p.append(h("h2", {}, v.title));
  p.append(h("p", { html: v.note }));
  if (v.modes) p.append(h("div", { class: "modebox" }, h("b", {}, state.mode), " · " + MODES[state.mode]));
  if (v.level === 4) {
    const owner = VIEWS[v.parent].nodes.find(n => n.id === v.owner);
    p.append(h("p", { class: "muted" }, built.model.hidden ? built.model.hidden + " private helpers hidden. Tick “Show private helpers” to see every symbol; dashed arrows mark calls that pass through one." : "Every top-level function, class and method is shown."));
    if (owner) { p.append(h("h3", {}, "Component")); p.append(h("p", {}, owner.desc)); }
    p.append(h("h3", {}, "Source")); p.append(srcLinks(v.files));
  }
  p.append(h("h3", {}, "Elements in this view"));
  const list = h("div", { class: "elist" });
  const nodes = [...built.model.nodes].sort((a, b) => (a.kind === "code" ? a.sym.line : 0) - (b.kind === "code" ? b.sym.line : 0));
  for (const n of nodes) list.append(h("button", { on: { click: () => select(n.id) } }, n.kind === "code" ? n.sym.name : n.name, h("small", {}, n.kind === "code" ? "L" + n.sym.line : (n.drill ? "⊞ " : "") + KIND[n.kind].label.toLowerCase())));
  p.append(list);
  if (v.level === 1) p.append(h("p", { class: "muted", style: "margin-top:14px" }, "Double-click LGTM, or select it and press Open, to see its containers."));
}
function panel() {
  const p = $("#panel"); p.innerHTML = "";
  if (!built) return;
  const id = state.sel;
  if (id && id.startsWith("cls:")) {
    const [, file, name] = id.split(":");
    const s = (CODE[file] || []).find(x => x.name === name);
    if (s) {
      p.append(kindChip("code", "class · " + file.split("/").pop()), h("h2", {}, "class " + s.name));
      if (s.doc) p.append(h("p", {}, s.doc));
      const ms = (CODE[file] || []).filter(x => x.parent === name);
      p.append(h("h3", {}, "Methods (" + ms.length + ")"));
      p.append(h("div", { class: "elist" }, ms.map(m => h("button", { on: { click: () => { const k = "s:" + file + ":" + m.name; if (built.byId.has(k)) select(k); else { state.privBy[state.view] = true; state.sel = k; render(); panel(); } } } }, m.name.split(".").pop() + m.sig, h("small", {}, "L" + m.line)))));
      p.append(h("h3", {}, "Source")); p.append(srcLinks([file], s.line, s.end));
      p.append(h("button", { class: "open", style: "background:var(--muted)", on: { click: () => select(null) } }, "Back to view summary"));
      return;
    }
  }
  const n = id && built.byId.get(id);
  if (!n) { viewSummary(p); return; }
  if (n.kind === "code") {
    const s = n.sym;
    p.append(kindChip("code", s.kind + " · " + s.file.split("/").pop()));
    p.append(h("h2", {}, s.name));
    p.append(h("div", { class: "sig" }, (s.kind === "class" ? "class " + s.name : "def " + s.name.split(".").pop() + s.sig)));
    p.append(h("p", {}, s.doc || h("span", { class: "muted" }, "No docstring.")));
    const callers = (CODE[s.file] || []).filter(x => (x.calls || []).includes(s.name));
    const mk = (list, title) => {
      p.append(h("h3", {}, title + " (" + list.length + ")"));
      if (!list.length) { p.append(h("p", { class: "muted" }, "None inside this file.")); return; }
      p.append(h("div", { class: "elist" }, list.map(q => {
        const k = "s:" + s.file + ":" + q.name;
        return h("button", { on: { click: () => { if (built.byId.has(k)) select(k); else { state.privBy[state.view] = true; state.sel = k; render(); panel(); } } } }, q.name, h("small", {}, "L" + q.line));
      })));
    };
    mk((s.calls || []).map(c => (CODE[s.file] || []).find(x => x.name === c)).filter(Boolean), "Calls in this file");
    mk(callers, "Called from this file");
    p.append(h("h3", {}, "Source")); p.append(srcLinks([s.file], s.line, s.end));
    return;
  }
  p.append(kindChip(n.kind, n.tech));
  p.append(h("h2", {}, n.name));
  p.append(h("p", {}, n.desc));
  if (n.drill) p.append(h("button", { class: "open", on: { click: () => go(n.drill) } }, "Open " + VIEWS[n.drill].title + " →"));
  if (n.modes && VIEWS[state.view].modes) {
    p.append(h("h3", {}, "Runs in modes"));
    p.append(h("p", {}, n.modes.length === ALL.length ? "All four modes." : n.modes.map(m => m).join(", ")));
  }
  if (n.more && n.more.length) { p.append(h("h3", {}, "Details")); p.append(h("ul", {}, n.more.map(m => h("li", {}, m)))); }
  p.append(h("h3", {}, "Relationships"));
  p.append(relList(n.id));
  const src = [...(n.code || []), ...(n.src || [])];
  if (src.length) { p.append(h("h3", {}, "Source")); p.append(srcLinks([...new Set(src)])); }
}

/* ---------- Search ---------- */
const INDEX = [];
for (const [vid, v] of Object.entries(VIEWS)) {
  if (v.level === 4) {
    for (const f of v.files) for (const s of CODE[f] || []) if (s.kind !== "class" || !(CODE[f] || []).some(x => x.parent === s.name))
      INDEX.push({ text: s.name, sub: f.split("/").pop() + ":" + s.line, view: vid, id: "s:" + f + ":" + s.name, priv: isPrivate(s.name) || (s.parent && isPrivate(s.parent)) });
  } else for (const n of v.nodes) INDEX.push({ text: n.name, sub: v.title.split(" · ")[0] + (n.tech ? " · " + n.tech : ""), view: vid, id: n.id, hay: [n.desc, n.tech, ...(n.src || []), ...(n.code || [])].join(" ") });
}
const q = $("#q"), res = $("#results");
let hits = [], act = 0;
function search() {
  const t = q.value.trim().toLowerCase();
  if (!t) { res.hidden = true; return; }
  const score = x => { const a = x.text.toLowerCase(); return a === t ? 0 : a.startsWith(t) ? 1 : a.includes(t) ? 2 : (x.sub + " " + (x.hay || "")).toLowerCase().includes(t) ? 3 : 9; };
  hits = INDEX.map(x => [score(x), x]).filter(([s]) => s < 9).sort((a, b) => a[0] - b[0] || VIEWS[a[1].view].level - VIEWS[b[1].view].level).slice(0, 30).map(([, x]) => x);
  act = 0; drawHits();
}
function drawHits() {
  res.innerHTML = "";
  if (!hits.length) { res.append(h("div", { class: "muted", style: "padding:8px" }, "No element, file or function matches.")); res.hidden = false; return; }
  hits.forEach((x, i) => res.append(h("button", { class: i === act ? "active" : "", on: { mousedown: ev => { ev.preventDefault(); pickHit(x); } } }, x.text, h("small", {}, x.sub))));
  res.hidden = false;
}
function pickHit(x) {
  q.value = ""; res.hidden = true;
  if (x.priv) state.privBy[x.view] = true;
  go(x.view, x.id);
}
q.addEventListener("input", search);
q.addEventListener("keydown", ev => {
  if (res.hidden) return;
  if (ev.key === "ArrowDown") { act = Math.min(act + 1, hits.length - 1); drawHits(); ev.preventDefault(); }
  else if (ev.key === "ArrowUp") { act = Math.max(act - 1, 0); drawHits(); ev.preventDefault(); }
  else if (ev.key === "Enter" && hits[act]) { pickHit(hits[act]); ev.preventDefault(); }
  else if (ev.key === "Escape") { res.hidden = true; ev.stopPropagation(); }
});
q.addEventListener("blur", () => setTimeout(() => { res.hidden = true; }, 120));

document.addEventListener("keydown", ev => {
  if (ev.target.closest && ev.target.closest("input")) return;
  if (ev.key === "Escape" || ev.key === "Backspace") {
    if (state.sel) select(null); else up();
    ev.preventDefault();
  } else if (ev.key === "/") { q.focus(); ev.preventDefault(); }
  else if (ev.key === "+" || ev.key === "=") zoomAt(1.2);
  else if (ev.key === "-") zoomAt(1 / 1.2);
  else if (ev.key === "0") fit();
});

/* ---------- Boot ---------- */
$("#sha").textContent = SHA.slice(0, 7);
function boot() {
  if (typeof dagre === "undefined") {
    $("#panel").innerHTML = "";
    $(".canvas").append(h("div", { class: "err" }, "The layout library (dagre) did not load, so the diagram cannot be drawn. Check the network connection and reload."));
    return;
  }
  const start = (location.hash || "").slice(1);
  state.view = VIEWS[start] ? start : "context";
  chrome(); render(); panel();
}
const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(boot);
</script>
