<text class="nt" x="19" y="414">What the agents see</text>
<text class="nb"><tspan x="19" y="431">The sanitized diff, the whole function</tspan><tspan x="19" y="443">around each change, policy excerpts and</tspan><tspan x="19" y="455">tool results. Prompts fill at most 80%</tspan><tspan x="19" y="467">of a 32k-token window.</tspan></text>
<rect class="note" x="248" y="395" width="230" height="98" rx="7"/>
<text class="nt" x="260" y="414">How the tools are limited</text>
<text class="nb"><tspan x="260" y="431">Read-only access to the base and PR</tspan><tspan x="260" y="443">commits. 5 calls per agent run, 24 for</tspan><tspan x="260" y="455">the investigator. Long results are cut;</tspan><tspan x="260" y="467">the investigator's repeat calls and</tspan><tspan x="260" y="479">whole-file reads are refused.</tspan></text>
<rect class="note" x="489" y="395" width="230" height="98" rx="7"/>
<text class="nt" x="501" y="414">What the judge sees</text>
<text class="nb"><tspan x="501" y="431">The claim, its CWE and the cited code,</tspan><tspan x="501" y="443">read fresh from the commit. Under 28,000</tspan><tspan x="501" y="455">characters, with worked examples of</tspan><tspan x="501" y="467">good answers.</tspan></text>
