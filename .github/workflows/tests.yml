name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Semgrep and CodeGraph let the tests that call the real binaries run
      # instead of skipping. No model is needed: the suite mocks Ollama.
      - name: Install LGTM with dev and SAST extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sast]"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CodeGraph (version the README pins)
        run: |
          npm install -g @colbymchenry/codegraph@1.6.2
          codegraph --version

      - name: Run tests
        run: python -m pytest tests/ -q
